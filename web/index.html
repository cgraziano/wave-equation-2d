<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wave Equation Simulator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      gap: 18px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      color: #aaa;
      text-transform: uppercase;
    }

    /* Scenario selector tabs */
    #scenario-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      background: #111;
      border: 1px solid #2a2a2a;
      color: #777;
      padding: 6px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .tab-btn:hover { border-color: #444; color: #bbb; }
    .tab-btn.active {
      border-color: #4a90d9;
      color: #4a90d9;
      background: #0d1a2a;
    }

    /* Description text */
    #description {
      max-width: 560px;
      font-size: 0.76rem;
      color: #555;
      line-height: 1.6;
      text-align: center;
    }

    #canvas-wrap {
      border: 1px solid #2a2a2a;
      box-shadow: 0 0 40px rgba(80, 160, 255, 0.08);
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #legend {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      color: #555;
    }
    #legend-bar {
      width: 160px;
      height: 10px;
      border-radius: 3px;
      background: linear-gradient(to right, #0060ff, #000, #ff4400);
    }

    #scrubber-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 560px;
    }
    #scrubber-wrap input { flex: 1; accent-color: #4a90d9; }

    #frame-label {
      font-size: 0.75rem;
      color: #444;
      min-width: 72px;
      text-align: right;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #ccc;
      padding: 6px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      transition: border-color 0.15s, color 0.15s;
    }
    button:hover { border-color: #555; color: #fff; }
    button.active { border-color: #4a90d9; color: #4a90d9; }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #777;
    }
    label input[type=range] { width: 110px; accent-color: #4a90d9; }

    #status {
      font-size: 0.72rem;
      color: #3a3a3a;
    }
  </style>
</head>
<body>

  <h1>Wave Equation Simulator</h1>

  <div id="scenario-tabs"></div>

  <p id="description"></p>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <div id="legend">
    <span>− amplitude</span>
    <div id="legend-bar"></div>
    <span>+ amplitude</span>
  </div>

  <div id="scrubber-wrap">
    <input type="range" id="scrubber" min="0" value="0" />
    <span id="frame-label">frame 0 / 0</span>
  </div>

  <div id="controls">
    <button id="btn-play">▶ Play</button>
    <button id="btn-restart">↺ Restart</button>
    <label>Speed <input type="range" id="speed" min="1" max="10" value="3" /></label>
  </div>

  <div id="status">Loading simulation data…</div>

  <script src="frames.js"></script>
  <script>
    (() => {
      if (typeof SCENARIOS === 'undefined') {
        document.getElementById('status').textContent =
          'Error: frames.js not found. Run the simulator first.';
        return;
      }

      // ----------------------------------------------------------------
      // Canvas + colour table setup
      // ----------------------------------------------------------------
      const CANVAS_SIZE = 560;
      const canvas = document.getElementById('canvas');
      const ctx    = canvas.getContext('2d');

      // Cache all 256 colours up front
      const colourTable = new Uint8Array(256 * 3);
      for (let b = 0; b < 256; b++) {
        const v = b - 128;           // -127 .. +127
        const t = Math.abs(v) / 127;
        const mid = Math.round(60 * t * (1 - t * 0.4));
        const hi  = Math.round(255 * t);
        const idx = b * 3;
        if (v >= 0) { colourTable[idx]=hi; colourTable[idx+1]=mid; colourTable[idx+2]=0;  }
        else        { colourTable[idx]=0;  colourTable[idx+1]=mid; colourTable[idx+2]=hi; }
      }

      // ----------------------------------------------------------------
      // Per-scenario decoded frame cache
      // ----------------------------------------------------------------
      const decodedCache = {};
      function getDecoded(key) {
        if (decodedCache[key]) return decodedCache[key];
        const sc = SCENARIOS[key];
        decodedCache[key] = sc.frames.map(b64 => {
          const bin = atob(b64);
          const buf = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
          return buf;
        });
        return decodedCache[key];
      }

      // ----------------------------------------------------------------
      // Render
      // ----------------------------------------------------------------
      let imgData = null;

      function renderFrame(key, frameIdx) {
        const sc      = SCENARIOS[key];
        const decoded = getDecoded(key);
        const { width, height } = sc;
        const scale   = Math.floor(CANVAS_SIZE / Math.max(width, height));

        if (!imgData || canvas.width !== width * scale || canvas.height !== height * scale) {
          canvas.width  = width  * scale;
          canvas.height = height * scale;
          imgData = ctx.createImageData(canvas.width, canvas.height);
          imgData.data.fill(255); // alpha
        }

        const buf    = decoded[frameIdx];
        const pixels = imgData.data;

        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const ci  = buf[y * width + x] * 3;
            const r = colourTable[ci], g = colourTable[ci+1], b = colourTable[ci+2];
            for (let dy = 0; dy < scale; dy++) {
              for (let dx = 0; dx < scale; dx++) {
                const px = ((y*scale+dy) * canvas.width + (x*scale+dx)) * 4;
                pixels[px]   = r;
                pixels[px+1] = g;
                pixels[px+2] = b;
                // alpha already 255
              }
            }
          }
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // ----------------------------------------------------------------
      // Playback state
      // ----------------------------------------------------------------
      let currentScenario = Object.keys(SCENARIOS)[0];
      let currentFrame    = 0;
      let playing         = false;
      let lastTime        = 0;

      const scrubber    = document.getElementById('scrubber');
      const frameLabel  = document.getElementById('frame-label');
      const btnPlay     = document.getElementById('btn-play');
      const speedSlider = document.getElementById('speed');
      const status      = document.getElementById('status');
      const descEl      = document.getElementById('description');

      function msPerFrame() { return 220 - Number(speedSlider.value) * 20; }

      function setFrame(idx) {
        const sc = SCENARIOS[currentScenario];
        currentFrame = Math.max(0, Math.min(idx, sc.frameCount - 1));
        renderFrame(currentScenario, currentFrame);
        scrubber.value = currentFrame;
        frameLabel.textContent = `frame ${currentFrame + 1} / ${sc.frameCount}`;
      }

      function tick(now) {
        if (!playing) return;
        if (now - lastTime >= msPerFrame()) {
          lastTime = now;
          const sc = SCENARIOS[currentScenario];
          if (currentFrame >= sc.frameCount - 1) {
            playing = false;
            btnPlay.textContent = '▶ Play';
            btnPlay.classList.remove('active');
            return;
          }
          setFrame(currentFrame + 1);
        }
        requestAnimationFrame(tick);
      }

      function togglePlay() {
        playing = !playing;
        if (playing) {
          const sc = SCENARIOS[currentScenario];
          if (currentFrame >= sc.frameCount - 1) setFrame(0);
          btnPlay.textContent = '⏸ Pause';
          btnPlay.classList.add('active');
          lastTime = performance.now();
          requestAnimationFrame(tick);
        } else {
          btnPlay.textContent = '▶ Play';
          btnPlay.classList.remove('active');
        }
      }

      function loadScenario(key) {
        playing = false;
        btnPlay.textContent = '▶ Play';
        btnPlay.classList.remove('active');

        currentScenario = key;
        const sc = SCENARIOS[key];
        scrubber.max = sc.frameCount - 1;
        descEl.textContent = sc.description;
        imgData = null; // force canvas resize

        // Update tab styles
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.key === key);
        });

        status.textContent =
          `${sc.frameCount} frames · ${sc.width}×${sc.height} grid · space = play/pause · ← → = step`;

        setFrame(0);
      }

      // ----------------------------------------------------------------
      // Build scenario tabs dynamically
      // ----------------------------------------------------------------
      const tabsEl = document.getElementById('scenario-tabs');
      for (const key of Object.keys(SCENARIOS)) {
        const btn = document.createElement('button');
        btn.className  = 'tab-btn';
        btn.dataset.key = key;
        btn.textContent = SCENARIOS[key].title;
        btn.addEventListener('click', () => loadScenario(key));
        tabsEl.appendChild(btn);
      }

      // ----------------------------------------------------------------
      // Wire controls
      // ----------------------------------------------------------------
      btnPlay.addEventListener('click', togglePlay);

      document.getElementById('btn-restart').addEventListener('click', () => {
        playing = false;
        btnPlay.textContent = '▶ Play';
        btnPlay.classList.remove('active');
        setFrame(0);
      });

      scrubber.addEventListener('input', () => {
        playing = false;
        btnPlay.textContent = '▶ Play';
        btnPlay.classList.remove('active');
        setFrame(Number(scrubber.value));
      });

      document.addEventListener('keydown', e => {
        if (e.key === ' ')          { e.preventDefault(); togglePlay(); }
        if (e.key === 'ArrowRight') setFrame(currentFrame + 1);
        if (e.key === 'ArrowLeft')  setFrame(currentFrame - 1);
      });

      // ----------------------------------------------------------------
      // Boot
      // ----------------------------------------------------------------
      loadScenario(currentScenario);
    })();
  </script>
</body>
</html>
